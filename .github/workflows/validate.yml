name: "Validate and test features"
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Validate devcontainer-feature.json files"
        uses: devcontainers/action@v1
        with:
          validate-only: "true"
          base-path-to-features: "./src"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - deno
          - prettier
    steps:
      - uses: actions/checkout@v7

      - name: "Install the Dev Container CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test feature '${{ matrix.feature }}' (scenarios on Debian 13)"
        run: devcontainer features test --skip-autogenerated --features "${{ matrix.feature }}" --project-folder .
